<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horsey Race Planner v3.1</title>

<style>
body{font-family:Arial;background:#0b0f14;color:#e6edf3;margin:0;padding:16px}
h1{margin:0 0 8px 0}
.panel{background:#111827;border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{padding:8px 12px;border-radius:8px;border:none;background:#2563eb;color:white;cursor:pointer}
.secondary{background:#374151}
.small{opacity:0.7;font-size:12px}
.warn{color:#f59e0b}
.bad{color:#ef4444}
.good{color:#22c55e}
pre{white-space:pre-wrap}
</style>
</head>

<body>

<h1>Horsey Race Planner v3.1</h1>
<div class="small">Simulation Lab Build</div>

<div class="panel">
<div class="row">
<button onclick="runSim()">Run Simulation</button>
<button onclick="copyJSON()">Copy JSON</button>
<button onclick="importJSON()">Import JSON</button>
</div>
</div>

<div class="panel">
<strong>Stats</strong>
<div id="stats"></div>
</div>

<div class="panel">
<strong>Simulation Output</strong>
<pre id="out"></pre>
</div>

<script>
let build={
 speed:130,
 stability:95,
 risk:20,
 chaos:40,
 genes:{RAMPAGE:'G',NARCOLEPSY:'G',HIGH_INTELLECT:'T',OMNIVORE:'A'}
};

function chaosLabel(v){
 if(v<15)return["Stable","good"];
 if(v<35)return["Volatile","warn"];
 if(v<60)return["Unstable","warn"];
 if(v<85)return["Hazardous","bad"];
 return["Theological Incident","bad"];
}

function simulateOne(){
 let perf = build.speed + (Math.random()*50);
 let chaosMult = build.chaos<20?0.8:build.chaos<40?1:build.chaos<60?1.3:build.chaos<85?1.7:2.5;

 if(build.genes.RAMPAGE==='G' && Math.random()<0.25){
  return{outcome:"DQ",note:"Aggressive behaviour",perf};
 }
 if(build.genes.NARCOLEPSY==='G' && Math.random()<0.15*chaosMult){
  return{outcome:"DNF",note:"Fell asleep",perf};
 }
 if(build.genes.OMNIVORE==='A' && Math.random()<0.1*chaosMult){
  return{outcome:"DNF",note:"Carnivore mode",perf};
 }
 if(build.genes.HIGH_INTELLECT==='T' && Math.random()<0.08*chaosMult){
  return{outcome:"DNS",note:"Refused race",perf:0};
 }
 if(Math.random()<0.1*chaosMult){
  return{outcome:"DNF",note:"Lost control",perf};
 }

 return{outcome:"FINISH",note:"Clean run",perf};
}

function runSim(){
 let runs=100;
 let res={WIN:0,PLACE:0,FINISH:0,DNF:0,DQ:0,DNS:0};
 let total=0,posTotal=0;
 let best=-Infinity,worst=Infinity;
 let logs=[];

 for(let i=0;i<runs;i++){
  let r=simulateOne();
  let pos=1;
  let score=r.perf||0;

  for(let j=0;j<7;j++){
   if((Math.random()*160+60)>score) pos++;
  }

  if(r.outcome==="DQ")res.DQ++;
  else if(r.outcome==="DNF")res.DNF++;
  else if(r.outcome==="DNS")res.DNS++;
  else if(pos===1)res.WIN++;
  else if(pos<=3)res.PLACE++;
  else res.FINISH++;

  total+=score;
  posTotal+=pos;
  best=Math.max(best,score);
  worst=Math.min(worst,score);

  if(logs.length<12){
   logs.push(`Run ${i+1}: ${r.outcome} - ${r.note} (Pos ${pos})`);
  }
 }

 let avg=(total/runs).toFixed(1);
 let avgPos=(posTotal/runs).toFixed(2);
 let c=chaosLabel(build.chaos);

 document.getElementById("stats").innerHTML=`Chaos: <span class="${c[1]}">${build.chaos} (${c[0]})</span>`;

 document.getElementById("out").textContent=
`WIN: ${res.WIN}
PLACE: ${res.PLACE}
FINISH: ${res.FINISH}
DNF: ${res.DNF}
DQ: ${res.DQ}
DNS: ${res.DNS}

Avg Performance: ${avg}
Avg Position: ${avgPos}

Best Run: ${best.toFixed(1)}
Worst Run: ${worst.toFixed(1)}

--- LOG ---
${logs.join("\n")}
`;
}

function copyJSON(){
 navigator.clipboard.writeText(JSON.stringify(build,null,2));
 alert("Copied");
}

function importJSON(){
 let txt=prompt("Paste JSON");
 if(!txt)return;
 try{build=JSON.parse(txt);alert("Loaded");}
 catch(e){alert("Invalid JSON");}
}
</script>

</body>
</html>
